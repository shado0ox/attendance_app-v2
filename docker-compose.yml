services:
  attendance_app:
    build: .
    container_name: attendance_app
    ports:
      - "3011:3011"
    env_file:
      - .env
    environment:
      - SQL_HOST=labor_postgres_db
      - BACKUP_ENABLED=${BACKUP_ENABLED:-true}
      - BACKUP_DIR=/app/backups
    volumes:
      - ./backups:/app/backups
    networks:
      - laborai_default
    restart: unless-stopped

networks:
  laborai_default:
    external: true