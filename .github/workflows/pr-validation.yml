name: PR validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SQL_HOST: 127.0.0.1
      SQL_PORT: 5432
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_DB_NAME: postgres
      DB_SCHEMA: shift_app
      DB_SSL: "false"
      JWT_SECRET: electronic-documents-ci-secret
      APP_URL: https://attendance.example.com
      BACKUP_ENABLED: "false"
      RESEND_API_KEY: mock-key
      RESEND_FROM: Attendance <attendance@example.com>

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: node --import tsx --test tests/*.test.ts

      - name: Electronic documents integration test
        run: node --import tsx tests/electronicDocuments.integration.ts
