name: Android preview APK
on:
  pull_request:
    paths:
      - '.github/workflows/android-preview.yml'
      - 'scripts/generate-android-preview.cjs'
      - 'public/icons/**'
      - 'public/manifest.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install isolated Android generator
        run: npm install --prefix "$RUNNER_TEMP/bubblewrap" @bubblewrap/cli@1.25.0
      - name: Generate preview project
        env:
          BUBBLEWRAP_ROOT: ${{ runner.temp }}/bubblewrap
          ANDROID_PREVIEW_OUTPUT: ${{ runner.temp }}/wafr-android
        run: node scripts/generate-android-preview.cjs
      - name: Build unsigned APK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          gradle --no-daemon --max-workers=2 -p "$RUNNER_TEMP/wafr-android" assembleRelease
          mkdir -p "$RUNNER_TEMP/apk-artifact"
          cp "$RUNNER_TEMP/wafr-android/app/build/outputs/apk/release/app-release-unsigned.apk" "$RUNNER_TEMP/apk-artifact/wafr-dawam-preview-unsigned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: wafr-dawam-preview-unsigned
          path: ${{ runner.temp }}/apk-artifact/
          retention-days: 14
          if-no-files-found: error
