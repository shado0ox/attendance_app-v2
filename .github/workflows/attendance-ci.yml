name: Attendance checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SQL_HOST: 127.0.0.1
      SQL_PORT: 5432
      SQL_USER: attendance_ci
      SQL_PASSWORD: ci-only-password
      SQL_DB_NAME: attendance_ci
      DB_SCHEMA: shift_app
      DB_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Start local PostgreSQL for integration checks
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-client
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE attendance_ci WITH LOGIN SUPERUSER PASSWORD 'ci-only-password';"
          sudo -u postgres createdb -O attendance_ci attendance_ci
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node --import tsx --test tests/*.test.ts
      - run: node --import tsx tests/mainDataConcurrency.integration.ts
      - run: node --import tsx tests/emailVerification.integration.ts
      - run: node --import tsx tests/whatsappReminders.integration.ts
      - run: node --import tsx tests/attendanceBreaks.integration.ts
      - run: node --import tsx tests/companyBackup.integration.ts
      - run: node --import tsx tests/appInstallation.integration.ts
      - run: node --import tsx tests/systemHealth.integration.ts
      - run: node --import tsx tests/companyIdentity.integration.ts
      - run: node --import tsx tests/tenantPrivacy.integration.ts
      - run: node --import tsx tests/employeeSelfService.integration.ts
      - run: node --import tsx tests/electronicDocuments.integration.ts
      - run: node --import tsx tests/attendancePush.integration.ts
      - run: node --import tsx tests/attendancePasskey.integration.ts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.documents.config.ts
