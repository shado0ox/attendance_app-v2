name: Native employee mobile
on:
  pull_request:
    paths: ['mobile/**', 'src/lib/mobileEmployee.ts', 'src/server/mobileEmployee.ts', '.github/workflows/native-mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cancel-obsolete:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'native-mobile.yml', branch: pr.head.ref, per_page: 100,
            });
            for (const run of data.workflow_runs) {
              if (run.id === context.runId || run.head_sha === pr.head.sha || run.event !== 'pull_request') continue;
              if (run.head_repository?.full_name !== pr.head.repo.full_name) continue;
              if (!['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(run.status)) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                core.info('Cancelled obsolete native build ' + run.id);
              } catch (error) {
                core.warning('Could not cancel obsolete build ' + run.id + ': ' + error.message);
              }
            }
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verify generated iOS release configuration
        run: |
          npx expo prebuild --platform ios --no-install
          node scripts/verify-ios-config.cjs
      - run: npm run export
      - name: Package native source for Mac and Android
        run: |
          mkdir -p build
          git -C .. archive --format=zip --prefix=WafrDawam-Native/ HEAD mobile docs/native-mobile.md > build/WafrDawam-Native-Source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: wafr-native-source
          path: mobile/build/WafrDawam-Native-Source.zip
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wafr-native-javascript
          path: mobile/dist/
          retention-days: 14
  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install required NDK with bounded download retries
        run: |
          WAFR_SDK_DIR=${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK path is missing}}
          test -d "$WAFR_SDK_DIR"
          if [ -f "$WAFR_SDK_DIR/ndk/27.1.12297006/source.properties" ]; then exit 0; fi
          for attempt in 1 2 3; do
            if sdkmanager --sdk_root="$WAFR_SDK_DIR" 'ndk;27.1.12297006'; then exit 0; fi
            echo "NDK download failed on attempt $attempt; removing incomplete SDK download."
            rm -rf "$WAFR_SDK_DIR/ndk/27.1.12297006" "$WAFR_SDK_DIR/.temp/PackageOperation"*
            sleep 5
          done
          exit 1
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Compile native Android application
        run: ./android/gradlew -p android assembleRelease bundleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
      - uses: actions/upload-artifact@v4
        with:
          name: wafr-native-android
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: error
  ios:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - run: node scripts/verify-ios-config.cjs
      - name: Compile native iPhone application
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          PROJECT=$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build > build-ios.log 2>&1 || { tail -150 build-ios.log; exit 1; }
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build > build-device.log 2>&1 || { tail -150 build-device.log; exit 1; }
          node scripts/verify-ios-config.cjs --bundle build/simulator/Build/Products/Release-iphonesimulator/*.app
          node scripts/verify-ios-config.cjs --bundle build/device/Build/Products/Release-iphoneos/*.app
          mkdir -p build/artifacts
          ditto -c -k --keepParent build/simulator/Build/Products/Release-iphonesimulator/*.app build/artifacts/WafrDawam-Native-Simulator.zip
          ditto -c -k --keepParent build/device/Build/Products/Release-iphoneos/*.app build/artifacts/WafrDawam-Native-Device-Unsigned.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wafr-native-ios
          path: |
            mobile/build/artifacts/
            mobile/build-ios.log
            mobile/build-device.log
          retention-days: 14
  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wafr-native-android
          path: native-artifacts
      - name: Locate installable release APK
        run: |
          APK=$(find native-artifacts -name '*.apk' -print -quit)
          if [ "$APK" != "native-artifacts/app-release.apk" ]; then cp "$APK" native-artifacts/app-release.apk; fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash mobile/scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wafr-native-runtime
          path: |
            native-artifacts/*.png
            native-artifacts/*.xml
            native-artifacts/*.log
          retention-days: 14
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: npx playwright install --with-deps chromium
      - name: Check native component layouts with isolated browser adapters
        run: node mobile/tests/visual/check.cjs
        env:
          WAFR_VISUAL_OUTPUT: mobile/build/layout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wafr-native-layout
          path: mobile/build/layout/
          retention-days: 14
